name: Daily Rumble Podcast

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg (preinstalled on ubuntu-latest)
        run: ffmpeg -version | head -1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          # GitHub ubuntu runners already ship Playwright OS dependencies,
          # so only the browser binary is needed. Retry in case of CDN flakiness.
          for i in 1 2 3; do
            python -m playwright install chromium && break
            echo "playwright install attempt $i failed, retrying..."
            sleep 5
          done
          python -m playwright install chromium

      - name: Generate episode video (rotating scripts)
        run: |
          mkdir -p output
          SCRIPTS=$(ls scripts/*.txt)
          COUNT=$(echo "$SCRIPTS" | wc -l)
          INDEX=$(( ( $(date +%j) % COUNT ) ))
          SCRIPT=$(echo "$SCRIPTS" | sed -n "$((INDEX + 1))p")
          echo "Selected script: $SCRIPT"
          python generate_video.py "$SCRIPT"

      - name: Upload to Rumble
        env:
          RUMBLE_EMAIL: ${{ secrets.RUMBLE_EMAIL }}
          RUMBLE_PASSWORD: ${{ secrets.RUMBLE_PASSWORD }}
        run: |
          VIDEO=$(find output -name 'final_video.mp4' | sort | tail -1)
          THUMB=$(find output -name 'thumbnail.png' | sort | tail -1)
          echo "Uploading: $VIDEO"
          python rumble_upload.py --video "$VIDEO" --title "Cat Podcast Episode - $(date +%Y-%m-%d)" --thumbnail "$THUMB"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode-${{ github.run_number }}
          path: |
            output/episode_*/final_video.mp4
            output/episode_*/thumbnail.png
            rumble_before_publish.png
            rumble_after_publish.png
            rumble_debug_*.png
          retention-days: 7
