name: Daily Rumble Podcast

on:
  schedule:
    - cron: '0 11 * * *'
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Validate scripts directory
        run: |
          if [ ! -d "scripts" ] || [ -z "$(ls scripts/*.txt 2>/dev/null)" ]; then
            echo "ERROR: No scripts found in scripts/ directory"
            exit 1
          fi
          echo "Available scripts:"
          ls -la scripts/*.txt

      - name: Generate episode video (rotating scripts)
        run: |
          mkdir -p output
          SCRIPTS=(scripts/*.txt)
          COUNT=${#SCRIPTS[@]}
          
          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No script files found"
            exit 1
          fi
          
          # Use day of year for rotation
          DAY_OF_YEAR=$(date +%j)
          INDEX=$(( DAY_OF_YEAR % COUNT ))
          SCRIPT="${SCRIPTS[$INDEX]}"
          
          echo "Selected script: $SCRIPT (index $INDEX of $COUNT scripts)"
          python generate_video.py "$SCRIPT"

      - name: Validate generated files
        run: |
          # Find the most recent episode directory
          EPISODE_DIR=$(find output -maxdepth 1 -type d -name "episode_*" | sort | tail -1)
          
          if [ -z "$EPISODE_DIR" ]; then
            echo "ERROR: No episode directory found"
            exit 1
          fi
          
          echo "Episode directory: $EPISODE_DIR"
          
          # Check for required files
          if [ ! -f "$EPISODE_DIR/final_video.mp4" ]; then
            echo "ERROR: final_video.mp4 not found"
            exit 1
          fi
          
          if [ ! -f "$EPISODE_DIR/thumbnail.png" ]; then
            echo "WARNING: thumbnail.png not found, will upload without thumbnail"
          fi
          
          # Print file sizes
          ls -lh "$EPISODE_DIR/"
          
          # Verify video is valid
          ffprobe -v error -show_format -show_streams "$EPISODE_DIR/final_video.mp4" > /dev/null 2>&1 || {
            echo "ERROR: Generated video is corrupted or invalid"
            exit 1
          }
          
          echo "Generated files validated successfully"

      - name: Validate secrets
        env:
          RUMBLE_EMAIL: ${{ secrets.RUMBLE_EMAIL }}
          RUMBLE_PASSWORD: ${{ secrets.RUMBLE_PASSWORD }}
          RUMBLE_COOKIES: ${{ secrets.RUMBLE_COOKIES }}
        run: |
          # Presence booleans only - values are never echoed (Actions masks
          # them anyway, but this keeps the log readable).
          echo "RUMBLE_COOKIES present:   $([ -n "$RUMBLE_COOKIES" ] && echo yes || echo NO)"
          echo "RUMBLE_EMAIL present:     $([ -n "$RUMBLE_EMAIL" ] && echo yes || echo NO)"
          echo "RUMBLE_PASSWORD present:  $([ -n "$RUMBLE_PASSWORD" ] && echo yes || echo NO)"

          if [ -z "$RUMBLE_COOKIES" ] && { [ -z "$RUMBLE_EMAIL" ] || [ -z "$RUMBLE_PASSWORD" ]; }; then
            echo "::error title=Rumble credentials missing::Set RUMBLE_COOKIES (preferred, from capture_cookies.bat) or RUMBLE_EMAIL + RUMBLE_PASSWORD."
            exit 1
          fi

          if [ -n "$RUMBLE_COOKIES" ]; then
            if ! printf '%s' "$RUMBLE_COOKIES" | python -c "import json,sys; d=json.load(sys.stdin); c=d if isinstance(d,list) else d.get('cookies',[]); assert isinstance(c,list) and c, 'cookie list empty'; print('cookie payload: JSON OK,', len(c), 'cookies')"; then
              echo "::warning title=RUMBLE_COOKIES not valid JSON::Falling back to email/password login if configured."
            fi
          fi
          echo "Secrets validated OK"

      - name: Upload to Rumble
        env:
          RUMBLE_EMAIL: ${{ secrets.RUMBLE_EMAIL }}
          RUMBLE_PASSWORD: ${{ secrets.RUMBLE_PASSWORD }}
          RUMBLE_COOKIES: ${{ secrets.RUMBLE_COOKIES }}
        run: |
          # Find the most recent episode
          EPISODE_DIR=$(find output -maxdepth 1 -type d -name "episode_*" | sort | tail -1)
          VIDEO="$EPISODE_DIR/final_video.mp4"
          THUMB="$EPISODE_DIR/thumbnail.png"
          
          if [ ! -f "$VIDEO" ]; then
            echo "ERROR: Video file not found: $VIDEO"
            exit 1
          fi
          
          echo "Uploading: $VIDEO"
          echo "Thumbnail: $THUMB"
          
          # Build upload command as array (safe for spaces/special chars)
          CMD=(python rumble_upload.py --video "$VIDEO" --title "Cat Podcast Episode - $(date +%Y-%m-%d)")
          
          if [ -f "$THUMB" ]; then
            CMD+=(--thumbnail "$THUMB")
          fi
          
          if ! "${CMD[@]}"; then
            echo "::error title=Rumble upload failed::See the log above. If the session was invalid: re-capture cookies locally with capture_cookies.bat and update RUMBLE_COOKIES (or set RUMBLE_EMAIL + RUMBLE_PASSWORD so the job can log in by itself)."
            exit 1
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode-${{ github.run_number }}
          path: |
            output/episode_*/final_video.mp4
            output/episode_*/thumbnail.png
            output/episode_*/metadata.json
            rumble_before_publish.png
            rumble_after_publish.png
            rumble_debug_*.png
          retention-days: 14

      - name: Cleanup old episodes (keep last 5)
        if: always()
        run: |
          # Remove episode directories older than 5 runs to save disk space
          EPISODES=$(find output -maxdepth 1 -type d -name "episode_*" | sort -r)
          COUNT=0
          for EP in $EPISODES; do
            COUNT=$((COUNT + 1))
            if [ $COUNT -gt 5 ]; then
              echo "Removing old episode: $EP"
              rm -rf "$EP"
            fi
          done
